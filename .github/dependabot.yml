# Dependabot vulnerability + version update scanning.
#
# Three ecosystems cover the surface area:
#   - nuget        → src/ToastRevival.Api + src/ToastRevival.Agent + tests
#   - npm          → src/ToastRevival.Dashboard
#   - github-actions → .github/workflows
#
# Weekly cadence keeps PR noise low; security advisories surface immediately
# regardless of the schedule.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      aspnet-core:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.Extensions.*"
      ef-core:
        patterns:
          - "Microsoft.EntityFrameworkCore.*"
          - "Npgsql*"
      test-stack:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "Testcontainers*"
          - "Respawn"

  - package-ecosystem: "npm"
    directory: "/src/ToastRevival.Dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - "react"
          - "react-*"
          - "@types/react*"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      typescript:
        patterns:
          - "typescript"
          - "@types/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
