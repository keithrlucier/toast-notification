name: API Integration Tests

on:
  push:
    branches:
      - main
    paths:
      - 'src/ToastRevival.Api/**'
      - 'tests/ToastRevival.Api.Tests/**'
      - 'ToastRevival.sln'
      - '.github/workflows/api-tests.yml'
  pull_request:
    paths:
      - 'src/ToastRevival.Api/**'
      - 'tests/ToastRevival.Api.Tests/**'
      - 'ToastRevival.sln'
      - '.github/workflows/api-tests.yml'
  workflow_dispatch:

jobs:
  api-tests:
    name: Run integration tests against PostgreSQL 16
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: toastrevival_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Bypasses the Testcontainers code path in PostgresFixture and
      # uses the GitHub-managed Postgres service container instead.
      TOAST_TEST_CONNECTION_STRING: "Host=localhost;Port=5432;Database=toastrevival_test;Username=postgres;Password=postgres"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore (Api + Api.Tests only)
        run: dotnet restore tests/ToastRevival.Api.Tests/ToastRevival.Api.Tests.csproj

      - name: Build test project
        run: dotnet build tests/ToastRevival.Api.Tests/ToastRevival.Api.Tests.csproj --configuration Release --no-restore

      - name: Run integration tests
        run: dotnet test tests/ToastRevival.Api.Tests/ToastRevival.Api.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal" --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: TestResults/**/*.trx
          retention-days: 14
