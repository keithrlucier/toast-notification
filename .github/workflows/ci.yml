name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        # Tests use Testcontainers (PostgreSQL) which requires Docker — ubuntu-latest runners include Docker.
        # Load tests are opt-in via env var and skip automatically in CI (LoadTests.cs checks TOAST_LOAD_TEST_1K).
        run: dotnet test --no-build -c Release --verbosity normal --filter "category!=load-1k&category!=registration-load"

      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  build-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ToastRevival.Dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
