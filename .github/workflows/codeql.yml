# CodeQL static analysis — closes the SAST gap called out post-M8.C.
#
# Two languages cover the working surface:
#   - csharp      → src/ToastRevival.Api + src/ToastRevival.Agent + tests
#   - javascript-typescript → src/ToastRevival.Dashboard
#
# Triggers: push to main, PR to main, weekly cron (catches rule updates).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:13 UTC — off-peak, off-hour to avoid clashing with the
    # Dependabot Monday cadence.
    - cron: "13 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build (C#)
        if: matrix.language == 'csharp'
        run: |
          dotnet restore src/ToastRevival.Api/ToastRevival.Api.csproj
          dotnet build src/ToastRevival.Api/ToastRevival.Api.csproj \
            --configuration Release \
            --no-restore \
            --nologo

      - name: Perform Analysis
        # SARIF upload requires Code Scanning to be enabled at the repo level
        # (Settings → Code security → Code scanning → Set up). Until then the
        # analyze step runs and produces results locally but the upload returns
        # "Code scanning is not enabled for this repository" and fails the job,
        # which spam-mails every push. continue-on-error keeps the analysis
        # output visible in the workflow log without failing the run.
        # Remove this once code scanning is enabled in repo settings.
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
