<?xml version="1.0" encoding="UTF-8"?>
<!--
  Toast Notification — design canon for tray icons and Microsoft Store tiles.
  Diana, M9.C, 2026-05-10.

  Single brand bell silhouette across every surface — tray, Start tile, Store
  listing. The bell path data here is byte-aligned with the C# implementation
  in src/ToastRevival.Agent/TrayIconService.cs::CreateBellIcon and the
  PowerShell renderer at scripts/generate-msix-tile-assets.ps1::New-BellPath.
  When iterating on the bell, change THIS file first, then port the path data
  to both renderers. The SVG is the source of truth.

  Brand palette (matches https://toastnotification.com marketing site):
    --panel-dark   #0A0F1A   tile background
    --brand-amber  #F59E0B   bell fill (Connected, Connecting halo)
    --state-amber  #F59E0B   Reconnecting / Disconnected
    --state-red    #DC2626   Error
    --state-dim    #7A7A92   Connecting (tray only)
    --text-primary #F0F0F5   Wide-tile wordmark
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220">
  <defs>
    <!-- The bell glyph as a reusable symbol. ViewBox 0..1 in both axes so any
         <use> element can rescale via x/y/width/height attributes. -->
    <symbol id="bell" viewBox="0 0 1 1">
      <rect x="0.45" y="0.10" width="0.10" height="0.06" fill="currentColor"/>
      <ellipse cx="0.50" cy="0.20" rx="0.22" ry="0.10" fill="currentColor"/>
      <polygon
        points="0.32,0.16 0.32,0.50 0.22,0.66 0.18,0.74 0.82,0.74 0.78,0.66 0.68,0.50 0.68,0.16"
        fill="currentColor"/>
      <ellipse cx="0.50" cy="0.85" rx="0.07" ry="0.07" fill="currentColor"/>
    </symbol>
  </defs>

  <!-- Row 1: tray icons at 32×32 (rendered native at 16×16). -->
  <g transform="translate(0,0)" font-family="Inter, Segoe UI, sans-serif" font-size="10">
    <text x="0" y="14" fill="#F0F0F5">Tray icons (5 states · native 16px)</text>

    <g transform="translate(0,30)" color="#F59E0B"><use href="#bell" width="32" height="32"/></g>
    <text x="0" y="78" fill="#9090A8">Connected</text>

    <g transform="translate(60,30)" color="#F59E0B"><use href="#bell" width="32" height="32"/></g>
    <text x="60" y="78" fill="#9090A8">Reconnecting</text>

    <!-- Disconnected: amber bell + diagonal slash to communicate "not delivering". -->
    <g transform="translate(120,30)" color="#F59E0B">
      <use href="#bell" width="32" height="32"/>
      <line x1="27.5" y1="5" x2="4.5" y2="28" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="120" y="78" fill="#9090A8">Disconnected</text>

    <!-- Error: red bell + slash. -->
    <g transform="translate(180,30)" color="#DC2626">
      <use href="#bell" width="32" height="32"/>
      <line x1="27.5" y1="5" x2="4.5" y2="28" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="180" y="78" fill="#9090A8">Error</text>

    <g transform="translate(240,30)" color="#7A7A92"><use href="#bell" width="32" height="32"/></g>
    <text x="240" y="78" fill="#9090A8">Connecting</text>
  </g>

  <!-- Row 2: Store tiles (scaled for layout, real assets at full resolution). -->
  <g transform="translate(0,100)" font-family="Inter, Segoe UI, sans-serif" font-size="10">
    <text x="0" y="14" fill="#F0F0F5">Microsoft Store tiles (production brand)</text>

    <!-- Square 44×44. Real asset rendered at exact size. -->
    <g transform="translate(0,30)">
      <rect width="44" height="44" fill="#0A0F1A"/>
      <g color="#F59E0B" transform="translate(4,4)"><use href="#bell" width="36" height="36"/></g>
    </g>
    <text x="0" y="92" fill="#9090A8">Square44 · 44×44</text>

    <!-- Square 150×150 with halo. -->
    <g transform="translate(60,30)">
      <rect width="80" height="80" fill="#0A0F1A"/>
      <ellipse cx="40" cy="40" rx="32" ry="32" fill="#F59E0B" fill-opacity="0.16"/>
      <g color="#F59E0B" transform="translate(14,14)"><use href="#bell" width="52" height="52"/></g>
    </g>
    <text x="60" y="124" fill="#9090A8">Square150 · 150×150</text>

    <!-- Wide 310×150 (scaled to 165×80 for layout). -->
    <g transform="translate(160,30)">
      <rect width="165" height="80" fill="#0A0F1A"/>
      <ellipse cx="36" cy="40" rx="28" ry="28" fill="#F59E0B" fill-opacity="0.16"/>
      <g color="#F59E0B" transform="translate(11,15)"><use href="#bell" width="50" height="50"/></g>
      <text x="74" y="38" fill="#F0F0F5" font-weight="700" font-size="14">Toast</text>
      <text x="74" y="56" fill="#F0F0F5" font-weight="400" font-size="11">Notification</text>
    </g>
    <text x="160" y="124" fill="#9090A8">Wide310 · 310×150 (scaled)</text>

    <!-- StoreLogo 50×50. -->
    <g transform="translate(345,30)">
      <rect width="50" height="50" fill="#0A0F1A"/>
      <g color="#F59E0B" transform="translate(5,5)"><use href="#bell" width="40" height="40"/></g>
    </g>
    <text x="345" y="92" fill="#9090A8">StoreLogo · 50×50</text>
  </g>
</svg>
