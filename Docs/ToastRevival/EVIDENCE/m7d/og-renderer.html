<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG card renderer (M7.D)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 630px;
    background: linear-gradient(135deg, #0F172A 0%, #1E293B 60%, #0F172A 100%);
    color: #F3F5F8;
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
    position: relative;
  }
  /* subtle accent bar on the left */
  .accent {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 8px;
    background: #00C9A7;
  }
  .frame {
    box-sizing: border-box;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
  }
  .top { display: flex; align-items: center; gap: 18px; }
  .top .mark {
    width: 56px; height: 56px;
    border-radius: 12px;
    background: #00C9A7;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .top .wordmark {
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: -0.01em;
    color: #F3F5F8;
  }
  .top .tag {
    margin-left: auto;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 14px;
    color: #94A3B8;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .headline {
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 700;
    font-size: 76px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: #F3F5F8;
    max-width: 980px;
    margin: 0;
  }
  .headline em {
    color: #00C9A7;
    font-style: normal;
  }
  .subhead {
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 400;
    font-size: 24px;
    line-height: 1.35;
    color: #CBD5E1;
    max-width: 880px;
    margin: 24px 0 0 0;
  }
  .bottom {
    display: flex;
    align-items: center;
    gap: 36px;
    border-top: 1px solid rgba(148, 163, 184, 0.18);
    padding-top: 28px;
  }
  .url {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 22px;
    color: #00C9A7;
    letter-spacing: 0.01em;
  }
  .price {
    margin-left: auto;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 18px;
    color: #94A3B8;
  }
  .price b { color: #F3F5F8; font-weight: 600; }
</style>
</head>
<body>
  <div class="accent"></div>
  <div class="frame">
    <div class="top">
      <div class="mark">
        <svg width="36" height="36" viewBox="0 0 32 32" role="img" aria-label="">
          <g fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 6 C 11 6, 8.5 9, 8.5 13.5 L 8.5 18 L 7 21.5 L 25 21.5 L 23.5 18 L 23.5 13.5 C 23.5 9, 21 6, 16 6 Z"/>
            <path d="M14 24 C 14 25.5, 15 26.5, 16 26.5 C 17 26.5, 18 25.5, 18 24"/>
            <path d="M19.5 12.5 L 15.5 16.5 L 13 14"/>
          </g>
        </svg>
      </div>
      <div class="wordmark">Toast Notification</div>
      <div class="tag">FOR MSPS</div>
    </div>

    <div>
      <h1 class="headline">
        Branded Windows notifications,<br/>
        sent from your <em>dashboard.</em>
      </h1>
      <p class="subhead">
        Multi-tenant API. Code-signed agent. Tracked end-to-end.
        Built for managed service providers and IT departments.
      </p>
    </div>

    <div class="bottom">
      <div class="url">toastnotification.com</div>
      <div class="price"><b>$0.22</b> per device per month &middot; <b>14-day free trial</b></div>
    </div>
  </div>
</body>
</html>
