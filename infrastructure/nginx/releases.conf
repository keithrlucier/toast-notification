# Velopack auto-update feed — releases.toastnotification.com
#
# Serves static Velopack release artifacts consumed by UpdateService.cs.
# Files live at /opt/toast/releases/agent/win-x64/ on TOASTWEB1.
#
# One-time setup (after DNS A record is live):
#   1. sudo cp /tmp/releases.conf /etc/nginx/sites-available/toast-releases
#      sudo ln -sf /etc/nginx/sites-available/toast-releases /etc/nginx/sites-enabled/toast-releases
#   2. sudo nginx -t && sudo systemctl reload nginx
#   3. sudo certbot --nginx -d releases.toastnotification.com
#
# DNS record required (Keith — Route 53 or wherever toast DNS lives):
#   A  releases.toastnotification.com  54.82.103.160
#
# Populate the feed (dev machine, after signing):
#   .\scripts\build-release.ps1 -Version X.Y.Z
#   scp -i Docs\Assets\Toast_Web_LightsailDefaultKey-us-east-1.pem `
#       artifacts\releases\* `
#       ubuntu@54.82.103.160:/opt/toast/releases/agent/win-x64/

server {
    server_name releases.toastnotification.com;
    listen 80;

    root /opt/toast/releases;

    # Windows agent fetches release metadata; CORS required
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Release index: agents must always see current version list
    location ~* releases\.win\.json$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Release packages: immutable once published, cache aggressively
    location ~* \.(zip|nupkg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
