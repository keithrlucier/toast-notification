# Velopack auto-update feed — releases.toastnotification.com
#
# Serves static Velopack release artifacts consumed by UpdateService.cs.
# Files live at /opt/toast/releases/agent/win-x64/ on TOASTWEB1.
#
# To publish a new agent version:
#   1. .\scripts\build-release.ps1 -Version X.Y.Z
#   2. scp -i Docs\Assets\Toast_Web_LightsailDefaultKey-us-east-1.pem `
#          artifacts\releases\* `
#          ubuntu@54.82.103.160:/opt/toast/releases/agent/win-x64/

server {
    server_name releases.toastnotification.com;

    root /opt/toast/releases;

    # Windows agent fetches release metadata; CORS required
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Release index: agents must always see current version list
    location ~* releases\.win\.json$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Release packages: immutable once published, cache aggressively
    location ~* \.(zip|nupkg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/releases.toastnotification.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/releases.toastnotification.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = releases.toastnotification.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name releases.toastnotification.com;
    listen 80;
    return 404; # managed by Certbot
}
