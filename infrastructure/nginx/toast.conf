server {
    server_name toastnotification.com www.toastnotification.com _;

    # React SPA static files
    root /opt/toast/dashboard;
    index index.html;

    # INFO-SEC-006: defensive headers for static SPA + marketing responses
    # plus HSTS now that nginx is the TLS terminator. Server-scope so they
    # inherit to every location unless a location adds its own (none do).
    # always applies to non-2xx (4xx/5xx error pages) too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API proxy
    location /api/ {
        proxy_pass         http://localhost:5216;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SignalR WebSocket
    location /hubs/ {
        proxy_pass         http://localhost:5216;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Uploaded assets
    location /assets/ {
        proxy_pass http://localhost:5216;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/toastnotification.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/toastnotification.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.toastnotification.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = toastnotification.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name toastnotification.com www.toastnotification.com _;
    return 404; # managed by Certbot




}
