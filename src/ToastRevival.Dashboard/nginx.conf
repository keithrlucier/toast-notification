server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # CFG-3 / CFG-2: defensive headers mirroring infrastructure/nginx/toast.conf.
    # Server-scope so they inherit to every location (no location adds its own
    # add_header, so inheritance is not reset). `always` so non-2xx error pages
    # carry them too. NOTE: HSTS is intentionally NOT set here — this container
    # serves cleartext :80 and a TLS terminator MUST run in front in production
    # (see README-SELF-HOST.md "Reverse Proxy and TLS"); the terminator owns HSTS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:" always;

    # Bound request bodies (asset uploads). Generous ceiling above the API's
    # per-endpoint RequestSizeLimit (5 MB) so legit logo/hero uploads pass.
    client_max_body_size 25m;

    # Proxy API calls to the backend container
    location /api/ {
        proxy_pass         http://toast-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SignalR WebSocket proxy
    location /hubs/ {
        proxy_pass         http://toast-api:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }

    # Uploaded asset library files (hero/logo/icon images). These are served by
    # the API container's static-file middleware from its wwwroot/assets volume.
    # Without this block they fall through to the SPA fallback below and the
    # browser receives index.html instead of the image, so previews never load.
    location /assets/ {
        proxy_pass         http://toast-api:8080/assets/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all unmatched routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
